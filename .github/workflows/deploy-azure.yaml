name: Deploy Heavy App to Azure

on:
  push:
    branches:
      - azure

permissions:
  id-token: write     
  contents: read     

jobs:
  deploy:
    name: Build and Deploy to Azure
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Log in to Azure Container Registry
      run: az acr login --name benchmarkacrkel8

    - name: Build and Deploy Backend (light-app-service)
      run: |
        ROBOT_ID=$(az identity show --name github-benchmark-robot --resource-group permanent-auth-vault-rg --query id -o tsv)
        
        # Native GitHub Runner Compile
        docker build -t benchmarkacrkel8.azurecr.io/light-app-backend:${{ github.sha }} ./backend
        
        # Push to Registry
        docker push benchmarkacrkel8.azurecr.io/light-app-backend:${{ github.sha }}
        
        # Update Container App Code (Preserves Database Environment Variables!)
        az containerapp update \
          --name light-app-service \
          --resource-group benchmark-apps-rg \
          --image benchmarkacrkel8.azurecr.io/light-app-backend:${{ github.sha }} \
          --registry-server benchmarkacrkel8.azurecr.io \
          --registry-identity $ROBOT_ID

    - name: Build and Deploy Frontend (light-app-frontend)
      run: |
        ROBOT_ID=$(az identity show --name github-benchmark-robot --resource-group permanent-auth-vault-rg --query id -o tsv)
        
        # Dynamically fetch the Backend's live URL
        BACKEND_URL=$(az containerapp show --name light-app-service --resource-group benchmark-apps-rg --query properties.configuration.ingress.fqdn -o tsv)
        
        # Native GitHub Runner Compile
        docker build -t benchmarkacrkel8.azurecr.io/light-app-frontend:${{ github.sha }} ./frontend
        
        # Push to Registry
        docker push benchmarkacrkel8.azurecr.io/light-app-frontend:${{ github.sha }}
        
        # Update Container App & Inject Backend URL
        az containerapp update \
          --name light-app-frontend \
          --resource-group benchmark-apps-rg \
          --image benchmarkacrkel8.azurecr.io/light-app-frontend:${{ github.sha }} \
          --registry-server benchmarkacrkel8.azurecr.io \
          --registry-identity $ROBOT_ID \
          --set-env-vars REACT_APP_API_URL=https://$BACKEND_URL VITE_API_URL=https://$BACKEND_URL
      wait-for-service-stability: true